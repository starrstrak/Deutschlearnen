<title>Deutsch mit Igi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Concept : un album de stickers. Contours épais, ombres dures, couleurs franches, mascotte hérisson. */
:root{
  --bg:#EDF1FF;--surface:#FFFFFF;--ink:#1B2150;--muted:#525C8C;--line:#1B2150;--soft:#DCE3FF;
  --primary:#4457FF;--sun:#FFC83A;--on-sun:#1B2150;--orange:#FF8844;--sky:#33B5F2;
  --der:#2F6BFF;--die:#E02F6B;--das:#0F8A5F;--good:#12975F;--bad:#D93B41;
  --igi-spike:#6A4B3A;--igi-skin:#F6D9B8;--igi-foot:#D9B08A;
  --fd:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --fb:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1130;--surface:#1B2058;--ink:#F1F3FF;--muted:#A8B1E8;--line:#05071C;--soft:#272D6E;
    --primary:#5C6CFF;--die:#EE4E83;--das:#19A872;--good:#19A872;--bad:#EF5A60;--igi-spike:#8C6B57;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1130;--surface:#1B2058;--ink:#F1F3FF;--muted:#A8B1E8;--line:#05071C;--soft:#272D6E;
  --primary:#5C6CFF;--die:#EE4E83;--das:#19A872;--good:#19A872;--bad:#EF5A60;--igi-spike:#8C6B57;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 var(--fb)}
#app{max-width:900px;margin-inline:auto;padding-inline:16px;padding-block:0 56px}
h1,h2,h3{font-family:var(--fd);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(2rem,8vw,2.8rem);line-height:1.1}
h2{font-size:1.5rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.ic{width:1.3em;height:1.3em;flex:none;vertical-align:middle}
.center{justify-content:center;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* barre du haut */
.top,.gtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:10px;padding-block:12px;background:var(--bg)}
.top{justify-content:space-between}
.stats{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);padding:4px 12px;font-family:var(--fd);font-size:1.05rem;min-height:44px}
.chip b{font-weight:400}
.who{padding-left:5px}
.av{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);color:#fff;font-family:var(--fd);font-size:1rem;text-shadow:0 1px 0 rgba(0,0,0,.25)}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--fd);font-size:1.2rem;letter-spacing:.02em;padding:.6em 1.4em;border:3px solid var(--line);border-radius:999px;background:var(--primary);color:#fff;box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:not(:disabled):active{transform:translateY(5px);box-shadow:0 0 0 var(--line)}
.btn.alt{background:var(--sun);color:var(--on-sun)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.small{font-size:1rem;padding:.4em 1em;box-shadow:0 4px 0 var(--line);min-height:44px}
.btn.small:not(:disabled):active{transform:translateY(4px)}
.btn.icon{padding:.4em .7em}

/* mascotte */
.igi{display:inline-block}
.igi svg{display:block;overflow:visible}
.igi.bounce svg{animation:bounce .6s}
.hero{display:flex;align-items:center;gap:20px;margin-block:6px 20px}
.igi-box{flex:none;cursor:pointer;background:none;border:0;padding:0}
.bubble{position:relative;background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:12px 16px;display:grid;gap:6px;justify-items:start;box-shadow:0 5px 0 var(--line);min-width:0}
.bubble::before{content:"";position:absolute;left:-12px;top:38px;width:18px;height:18px;background:var(--surface);border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg)}
.bubble .de{font-family:var(--fd);font-size:1.6rem;line-height:1.15}
.bubble .fr{color:var(--muted)}

/* défi du jour */
.daily{display:grid;gap:2px;width:100%;text-align:left;background:var(--sun);color:var(--on-sun);border:3px solid var(--line);border-radius:24px;padding:14px 20px;box-shadow:0 7px 0 var(--line);margin-bottom:26px;transition:transform .08s,box-shadow .08s}
.daily:not(.off):active{transform:translateY(7px);box-shadow:0 0 0 var(--line)}
.daily .dt{font-family:var(--fd);font-size:1.8rem;line-height:1.1}
.daily .ds{font-weight:700}
.daily .dp{font-size:.95rem}
.daily.off{background:var(--soft);color:var(--muted);box-shadow:0 4px 0 var(--line)}
.note{display:block;width:100%;margin:-8px 0 20px;padding:10px 14px;border:3px dashed var(--line);border-radius:16px;background:var(--surface);text-align:left}

/* mondes */
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-block:26px 12px}
.sec small{font-family:var(--fb);font-size:1rem;color:var(--muted)}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 14px}
.tile{--w:#4457FF;display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 14px 16px;background:var(--surface);background:color-mix(in srgb,var(--w) 24%,var(--surface));border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);transition:transform .08s,box-shadow .08s;min-width:0}
.tile:active{transform:translateY(6px);box-shadow:0 0 0 var(--line)}
.sticker{display:grid;place-items:center;width:66px;height:66px;margin:-30px 0 6px -4px;border-radius:50%;background:var(--surface);border:3px solid var(--line);font-size:34px;transform:rotate(-7deg);box-shadow:0 3px 0 var(--line)}
.worlds .tile:nth-child(even) .sticker{transform:rotate(6deg)}
.sticker.big{width:84px;height:84px;margin:0;font-size:44px;flex:none}
.tn{font-family:var(--fd);font-size:1.5rem;line-height:1.1}
.tf{color:var(--muted);font-size:.95rem}
.tc{font-size:.85rem;font-weight:700}
.bar{display:block;height:14px;border-radius:99px;background:var(--surface);border:2px solid var(--line);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;width:var(--p);background:var(--w,var(--good));border-right:2px solid var(--line);min-width:0}
.bar>i[style*="--p:0%"]{border-right:0}
.albumbtn{margin-top:28px;width:100%}

/* monde */
.wban{--w:#4457FF;display:flex;align-items:center;gap:16px;margin-block:20px 24px}
.wban>div{flex:1;min-width:0;display:grid;gap:4px}
.wban .fr{color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.act{display:grid;gap:6px;align-content:start;text-align:left;padding:16px;background:var(--surface);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);transition:transform .08s,box-shadow .08s;min-width:0}
.act:active{transform:translateY(6px);box-shadow:0 0 0 var(--line)}
.act .ai{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;border:3px solid var(--line);font-size:1.5rem}
.act:nth-child(1) .ai{background:var(--sun);color:var(--on-sun)}
.act:nth-child(2) .ai{background:var(--primary);color:#fff}
.act:nth-child(3) .ai{background:var(--good);color:#fff}
.act:nth-child(4) .ai{background:var(--die);color:#fff}
.act .at{font-family:var(--fd);font-size:1.35rem;line-height:1.1}
.act .as{color:var(--muted);font-size:.95rem}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.95rem;margin-bottom:10px}
.rows{display:grid;gap:10px}
.wrow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;text-align:left;background:var(--surface);border:3px solid var(--line);border-radius:18px;min-width:0}
.wrow .re{font-size:1.9rem;line-height:1;width:2.2rem;text-align:center;flex:none}
.wrow .re.num{font-family:var(--fd);color:var(--primary)}
.wrow .rw{flex:1;min-width:0;display:grid}
.wrow .rw b{font-family:var(--fd);font-weight:400;font-size:1.25rem;line-height:1.15}
.wrow .rw span{color:var(--muted);font-size:.92rem}
.pips{display:flex;gap:4px;flex:none}
.pips i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--soft)}
.pips i.on{background:var(--good)}

/* articles */
.art{display:inline-block;font-family:var(--fd);font-weight:400;font-size:.62em;line-height:1.2;padding:.12em .55em;border-radius:999px;color:#fff;border:2px solid var(--line);vertical-align:.18em;margin-right:.3em;letter-spacing:.02em}
.art.der{background:var(--der)}
.art.die{background:var(--die)}
.art.das{background:var(--das)}
.legend .art{font-size:.9rem;vertical-align:baseline;margin:0}

/* jeux : haut */
.gtop .bar{flex:1;height:18px;margin:0;--w:var(--sun)}
.gtop .cnt{font-family:var(--fd);font-size:1.1rem;min-width:3.2em;text-align:right}
.stage{display:grid;gap:14px;justify-items:center;margin-top:10px}
.prompt{display:grid;gap:10px;justify-items:center;text-align:center;width:100%}
.hint{color:var(--muted)}
.pic{display:block;font-size:clamp(84px,24vw,128px);line-height:1;letter-spacing:0}
.pic.num{font-family:var(--fd);color:var(--primary)}
.frbig{font-family:var(--fd);font-size:clamp(2rem,9vw,3rem);line-height:1.1;padding:10px 18px;background:var(--surface);border:3px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line)}
.frsm{font-size:1.2rem;color:var(--muted)}
.bigspk{position:relative;display:grid;place-items:center;width:112px;height:112px;border-radius:50%;background:var(--primary);color:#fff;border:3px solid var(--line);box-shadow:0 7px 0 var(--line);font-size:3rem;transition:transform .08s,box-shadow .08s}
.bigspk:active{transform:translateY(7px);box-shadow:0 0 0 var(--line)}
.bigspk .ic{width:56px;height:56px}
.bigspk::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--primary);opacity:0;animation:ring 1.8s ease-out infinite}

/* choix */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;width:100%;margin-top:6px}
.opt{display:grid;place-items:center;gap:6px;min-height:120px;min-width:0;padding:10px;background:var(--surface);color:var(--ink);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);font-family:var(--fd);transition:transform .08s,box-shadow .08s}
.opt:not(:disabled):active{transform:translateY(6px);box-shadow:0 0 0 var(--line)}
.opt .pic{font-size:clamp(54px,17vw,92px)}
.opt.tx{font-size:clamp(1.2rem,5vw,1.65rem);text-align:center;line-height:1.15;overflow-wrap:anywhere}
.opt:disabled{color:var(--ink)}
.opt.ok{background:var(--good);color:#fff;animation:pop .45s}
.opt.bad{background:var(--bad);color:#fff;animation:shake .45s}
.opt.ok:disabled,.opt.bad:disabled{color:#fff}
.opt.dim{opacity:.45}
.fb{display:flex;align-items:center;gap:12px;width:100%;margin-top:6px;padding:10px 14px;border:3px solid var(--line);border-radius:22px;background:var(--surface);flex-wrap:wrap}
.fb.ok{background:color-mix(in srgb,var(--good) 28%,var(--surface))}
.fb.bad{background:color-mix(in srgb,var(--bad) 22%,var(--surface))}
.fb .fbt{flex:1;min-width:150px;display:grid}
.fb .de{font-family:var(--fd);font-size:1.6rem;line-height:1.1}

/* découvrir */
.flash{width:100%;display:grid;gap:10px;justify-items:center;text-align:center;padding:24px 16px 20px;background:var(--surface);border:3px solid var(--line);border-radius:28px;box-shadow:0 8px 0 var(--line);animation:pop .35s}
.word{font-family:var(--fd);font-size:clamp(2rem,9vw,3.2rem);line-height:1.1;overflow-wrap:anywhere}
.word .art{font-size:.5em}
.flash .fr{font-size:1.3rem;color:var(--muted)}
.sent{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:6px;padding:8px 8px 8px 16px;border:3px dashed var(--line);border-radius:999px;font-family:var(--fd);font-size:1.25rem;flex-wrap:wrap}
.nav{display:flex;justify-content:space-between;gap:12px;width:100%;margin-top:10px}

/* memory */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;margin-top:6px}
@media (min-width:560px){.mgrid{grid-template-columns:repeat(4,1fr)}}
.mc{perspective:700px;border:0;background:none;padding:0;aspect-ratio:1/1.08;min-width:0}
.mi{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .35s}
.mc.up .mi{transform:rotateY(180deg)}
.mb,.mf{position:absolute;inset:0;display:grid;place-items:center;border:3px solid var(--line);border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 4px 0 var(--line);overflow:hidden}
.mb{background:var(--primary);color:#fff;font-family:var(--fd);font-size:2.2rem}
.mf{background:var(--surface);transform:rotateY(180deg);padding:4px;text-align:center;font-family:var(--fd);font-size:clamp(.95rem,4vw,1.35rem);line-height:1.15;color:var(--ink);overflow-wrap:anywhere}
.mf .pic{font-size:clamp(40px,11vw,64px)}
.mf .art{display:block;width:max-content;margin:0 auto 2px;font-size:.7em}
.mc.done .mf{background:color-mix(in srgb,var(--good) 30%,var(--surface))}
.mc.done .mi{animation:pop .4s}

/* lettres */
.slotrow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{width:clamp(36px,10.5vw,54px);height:clamp(46px,13vw,64px);display:grid;place-items:center;padding:0;background:var(--surface);color:var(--ink);border:3px dashed var(--line);border-radius:12px;font-family:var(--fd);font-size:clamp(1.5rem,6vw,2rem)}
.slot.f{border-style:solid;background:var(--sun);color:var(--on-sun)}
.slots.bad .slot{background:var(--bad);color:#fff;animation:shake .45s}
.slots.good .slot{background:var(--good);color:#fff;animation:pop .45s}
.slot:disabled{color:inherit}
.slots.good .slot:disabled{color:#fff}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.lt{width:clamp(44px,12vw,60px);height:clamp(52px,14vw,68px);display:grid;place-items:center;padding:0;background:var(--primary);color:#fff;border:3px solid var(--line);border-radius:14px;box-shadow:0 5px 0 var(--line);font-family:var(--fd);font-size:clamp(1.6rem,6.5vw,2.2rem);transition:transform .08s,box-shadow .08s}
.lt:not(:disabled):active{transform:translateY(5px);box-shadow:0 0 0 var(--line)}
.lt.used{visibility:hidden}
.lt:disabled{color:#fff}

/* résultat */
.res{display:grid;gap:12px;justify-items:center;text-align:center;margin-top:10px}
.res .fr{color:var(--muted);font-size:1.1rem}
.stars{display:flex;gap:6px}
.stars .bs{display:block;opacity:0;animation:pop .5s forwards}
.stars .ic{width:68px;height:68px}
.xp{font-family:var(--fd);font-size:1.4rem}

/* album */
.stks{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:12px}
.stk{display:grid;place-items:center;aspect-ratio:1;background:var(--surface);border:3px dashed var(--line);border-radius:18px;font-size:2.2rem;padding:0;min-width:0}
.stk span{filter:grayscale(1) contrast(.4) brightness(1.1);opacity:.35}
.stk.got{border-style:solid;box-shadow:0 4px 0 var(--line);background:color-mix(in srgb,var(--sun) 35%,var(--surface))}
.stk.got span{filter:none;opacity:1}
.stk .num{font-family:var(--fd);color:var(--primary)}

/* profils et réglages */
.pt{margin-block:6px 16px}
.panel{display:grid;gap:12px;padding:16px;margin-bottom:18px;background:var(--surface);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line)}
.panel label{font-weight:700}
.panel select,.panel input[type=text],.panel textarea{resize:vertical;font:inherit;color:var(--ink);background:var(--bg);border:3px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;min-height:48px}
.panel input[type=range]{width:100%;accent-color:var(--primary)}
.warn{padding:10px 14px;border:3px dashed var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.plist{display:grid;gap:12px;width:100%;margin-block:14px}
.pbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 16px;background:var(--surface);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);font-family:var(--fd);font-size:1.5rem}
.pbtn:active{transform:translateY(6px);box-shadow:0 0 0 var(--line)}
.pbtn .av{width:48px;height:48px;font-size:1.5rem}
.pbtn small{display:block;font-family:var(--fb);font-size:.95rem;color:var(--muted)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{position:relative;display:block}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw span{display:block;width:44px;height:44px;border-radius:50%;border:3px solid var(--line)}
.sw input:checked+span{box-shadow:0 0 0 4px var(--surface),0 0 0 7px var(--ink)}
.sw input:focus-visible+span{outline:4px solid var(--sky);outline-offset:6px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:10px 14px;background:var(--bg);border:3px solid var(--line);border-radius:14px;text-align:left}
.switch .pill{flex:none;width:52px;height:30px;border-radius:99px;border:3px solid var(--line);background:var(--soft);position:relative}
.switch .pill::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--line)}
.switch[aria-pressed="true"] .pill{background:var(--good)}
.switch[aria-pressed="true"] .pill::after{left:24px;background:#fff;border:2px solid var(--line);top:1px;width:20px;height:20px}

/* sens des exercices */
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:120px;min-height:48px;padding:8px 12px;background:var(--surface);color:var(--ink);border:3px solid var(--line);border-radius:999px;box-shadow:0 4px 0 var(--line);font-family:var(--fd);font-size:1.02rem;line-height:1.15;transition:transform .08s,box-shadow .08s}
.seg button.on{background:var(--primary);color:#fff}
.seg button:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
/* mots perso */
.wsay{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:0;background:none;border:0;text-align:left;color:inherit}
.wrow .del{flex:none}
.flashmsg{margin:0;padding:10px 14px;border:3px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--good) 25%,var(--surface))}
.f2{display:flex;gap:10px}
.f2>div{display:grid;gap:6px}
.f2>.grow{flex:1;min-width:0}
/* erreurs dans le jeu des lettres */
.slot{position:relative}
.slot.lk{border-style:solid;background:color-mix(in srgb,var(--good) 40%,var(--surface));color:var(--ink)}
.slot.wr{border-style:solid;background:var(--bad);color:#fff;animation:shake .45s}
.slot.wr::after{content:"✗";position:absolute;top:-11px;right:-9px;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;border:2px solid var(--line);font-family:var(--fd);font-size:.8rem;line-height:1}
.slot.lk:disabled,.slot.wr:disabled{color:inherit}
.slot.wr:disabled{color:#fff}

.plu{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:1.05rem}
.plu b{color:var(--ink);font-weight:700}
/* confettis */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 2.4s ease-in forwards}

@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-16px) rotate(-4deg)}65%{transform:translateY(0) rotate(3deg)}}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.3);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){

/* ================= utilitaires ================= */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function todayN(){return Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000);}

/* ================= sauvegarde ================= */
var KEY='deutsch-igi-v1';
function lsGet(){try{return localStorage.getItem(KEY);}catch(e){return null;}}
function lsSet(v){try{localStorage.setItem(KEY,v);}catch(e){}}
var DB=null;
try{DB=JSON.parse(lsGet()||'null');}catch(e){DB=null;}
if(!DB||!DB.players)DB={players:[],cur:null,sound:true,voice:'',rate:0.85};
if(typeof DB.rate!=='number')DB.rate=0.85;
function save(){lsSet(JSON.stringify(DB));try{if(window.IGI_CLOUD)window.IGI_CLOUD.changed();}catch(e){}}
function touchReg(){DB.rupd=Date.now();}
function me(){for(var i=0;i<DB.players.length;i++)if(DB.players[i].id===DB.cur)return DB.players[i];return null;}
function ws(x){var p=me();return p.words[x.k]||(p.words[x.k]={b:0,d:0});}
var INT=[0,1,2,4,7];
function grade(x,ok){var s=ws(x);s.b=ok?Math.min(4,s.b+1):Math.max(0,s.b-1);s.d=todayN()+INT[s.b];save();}
function isMaster(x){var s=me().words[x.k];return !!(s&&s.b>=3);}
function worldProg(w){var m=w.words.filter(isMaster).length;return{m:m,t:w.words.length,pct:w.words.length?m/w.words.length:0};}
function seenCount(p){return ALL.filter(function(x){return p.words[x.k];}).length;}
function level(xp){return 1+Math.floor(xp/120);}

/* mots partagés : fichier mots.txt du site, identique pour tous ; format « monde | der Hund = le chien = Hunde = 🐶 » */
var SHARED=[],SHARED_TXT=[],SHARED_FS=[];
function cleanEmo(e){return String(e||'').replace(/[<>&"'`]/g,'').slice(0,12);}
function setSharedAll(){
  var seen={},out=[];
  SHARED_FS.concat(SHARED_TXT).forEach(function(c){var k=c.wid+'-'+c.w.toLowerCase();if(seen[k])return;seen[k]=1;c.id=k;out.push(c);});
  SHARED=out;
}
function parseShared(t){
  var out=[];
  String(t||'').split(/\r?\n/).forEach(function(l){
    l=l.trim();if(!l||l.charAt(0)==='#')return;
    var b=l.indexOf('|');if(b<1)return;
    var wid=l.slice(0,b).trim().toLowerCase(),r=l.slice(b+1).split(/\s*=\s*/);
    if(!WORLD[wid]||r.length<2)return;
    var de=r[0].trim(),fr=(r[1]||'').trim(),pl=(r[2]||'').trim().replace(/^die\s+/i,''),em=cleanEmo(r[3]),a='',m=/^(der|die|das)\s+(.+)$/i.exec(de);
    if(m){a=m[1].toLowerCase();de=m[2].trim();}
    if(!de||!fr)return;
    out.push({id:wid+'-'+de.toLowerCase(),a:a,w:de,f:fr,e:em,p:pl,wid:wid});
  });
  return out;
}
function fsFromList(l){
  var out=[];
  (l||[]).forEach(function(f){
    if(!f||!f.w||!f.f||!WORLD[f.wid])return;
    var a=/^(der|die|das)$/.test(f.a||'')?f.a:'';
    out.push({id:'',a:a,w:String(f.w).slice(0,40),f:String(f.f).slice(0,60),e:cleanEmo(f.e),p:String(f.p||'').slice(0,40),wid:f.wid,fid:f.fid||''});
  });
  return out;
}
function setFsWords(list){
  try{localStorage.setItem('deutsch-igi-fs',JSON.stringify(list));}catch(e){}
  SHARED_FS=fsFromList(list);setSharedAll();rebuildCustom();softRender();
}
function softRender(){
  var a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&app.contains(a))return;
  if(S.screen==='home'||S.screen==='world'||S.screen==='settings'||S.screen==='profiles')render();
}
function loadShared(){
  try{var fc=localStorage.getItem('deutsch-igi-fs');if(fc)SHARED_FS=fsFromList(JSON.parse(fc));}catch(e){}
  try{var c=localStorage.getItem('deutsch-igi-shared');if(c)SHARED_TXT=parseShared(c);}catch(e){}
  setSharedAll();rebuildCustom();
  try{
    fetch('mots.txt?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(t){
      SHARED_TXT=parseShared(t);setSharedAll();
      try{localStorage.setItem('deutsch-igi-shared',t);}catch(e){}
      rebuildCustom();
      softRender();
    }).catch(function(){});
  }catch(e){}
}
/* mots ajoutés par la famille, dans n’importe quel monde, propres à chaque joueur */
function migrateCustom(){
  DB.custom=DB.custom||[];
  var ids={};DB.custom.forEach(function(c){ids[c.id]=1;});
  DB.players.forEach(function(p){
    if(!p.custom)return;
    p.custom.forEach(function(c){
      if(ids[c.id])return;
      var dup=DB.custom.some(function(d){return (d.wid||'perso')===(c.wid||'perso')&&d.w.toLowerCase()===c.w.toLowerCase()&&d.f.toLowerCase()===c.f.toLowerCase();});
      if(!dup){DB.custom.push(c);ids[c.id]=1;}
    });
    delete p.custom;
  });
  save();
}
function rebuildCustom(){
  var p=me(),hid=DB.hidden||{};
  WORLDS.forEach(function(w){
    if(!w._base)w._base=w.words.filter(function(x){return !x.cu;});
    w.words.forEach(function(x){if(x.cu)delete WBYK[x.k];});
    w.words=w._base.filter(function(x){return !hid[x.k];});
  });
  ALL.length=0;WORLDS.forEach(function(w){w.words.forEach(function(x){ALL.push(x);});});
  SHARED.forEach(function(c){
    var w=WORLD[c.wid];if(!w||hid['shared:'+c.id])return;
    if(w.words.some(function(y){return !y.cu&&y.w.toLowerCase()===c.w.toLowerCase();}))return;
    var x={k:'shared:'+c.id,world:w.id,a:c.a,w:c.w,f:c.f,e:c.e,p:c.p,s:'',cu:true,sh:true,fid:c.fid||''};
    w.words.push(x);WBYK[x.k]=x;ALL.push(x);
  });
  (DB.custom||[]).forEach(function(c){
    var w=WORLD[c.wid]||WORLD.perso;
    var x={k:'perso:'+c.id,world:w.id,a:c.a||'',w:c.w,f:c.f,e:c.e||'',p:c.p||'',s:'',cu:true};
    w.words.push(x);WBYK[x.k]=x;ALL.push(x);
  });
}
function addCustom(a,w,f,e,pl,wid){
  var p=me();
  if(!p||!w||!f)return false;
  DB.custom=DB.custom||[];
  if(DB.custom.length>=600)return false;
  wid=(WORLD[wid]&&wid)||'perso';
  pl=(pl||'').trim().replace(/^die\s+/i,'');
  var dup=DB.custom.some(function(c){return (c.wid||'perso')===wid&&c.w.toLowerCase()===w.toLowerCase()&&c.f.toLowerCase()===f.toLowerCase();});
  if(dup)return false;
  touchReg();
  DB.custom.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),a:a||'',w:w,f:f,e:e||'',p:pl,wid:wid});
  return true;
}
/* sens des exercices : de = allemand vers français, fr = français vers allemand, mix = au hasard */
function pickType(){
  var d=DB.dir||'mix';
  if(d==='de')return Math.random()<0.5?'A':'C';
  if(d==='fr')return 'D';
  var r=Math.random();
  return r<0.3?'A':r<0.5?'B':r<0.75?'C':'D';
}
function streakNow(p){return p.last>=todayN()-1?p.streak:0;}
function bumpStreak(){var p=me(),t=todayN();if(p.last===t)return;p.streak=(p.last===t-1)?p.streak+1:1;p.last=t;}
function dailyWords(n){
  var p=me(),t=todayN();
  var seen=ALL.filter(function(x){return p.words[x.k];});
  var due=shuffle(seen.filter(function(x){return p.words[x.k].d<=t;})).sort(function(a,b){return p.words[a.k].b-p.words[b.k].b;});
  var rest=shuffle(seen.filter(function(x){return due.indexOf(x)<0;})).sort(function(a,b){return p.words[a.k].b-p.words[b.k].b;});
  return shuffle(due.concat(rest).slice(0,n));
}

/* ================= voix ================= */
var TTS={ok:(typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined'),voices:[],fr:[],id:0,ready:false};
function loadVoices(){
  if(!TTS.ok)return;
  try{var all=speechSynthesis.getVoices();TTS.voices=all.filter(function(v){return /^de([-_]|$)/i.test(v.lang);});TTS.fr=all.filter(function(v){return /^fr([-_]|$)/i.test(v.lang);});}catch(e){TTS.voices=[];TTS.fr=[];}
}
function bestVoice(){

function parseLock(l){
  if(!l)return {t:'free'};
  if(typeof l==='number')return {t:'coins',n:l};
  if(/^l\d+$/.test(l))return {t:'lvl',n:+l.slice(1)};
  if(l.indexOf('b:')===0)return {t:'badge',id:l.slice(2)};
  return {t:'free'};
}
function itemPrice(it){var k=parseLock(it.lock);return k.t==='coins'?k.n:0;}
function usable(p,it){
  var k=parseLock(it.lock);
  if(k.t==='free'||p.owned.indexOf(it.id)>=0)return true;
  if(k.t==='lvl')return level(p.xp)>=k.n;
  if(k.t==='badge')return !!p.badges[k.id];
  return false;
}
function lockText(it){
  var k=parseLock(it.lock);
  if(k.t==='coins')return '🪙 '+k.n;
  if(k.t==='lvl')return '🔒 Niveau '+k.n;
  if(k.t==='badge')return '🔒 Trophée « '+(TBYID[k.id]?TBYID[k.id].name:k.id)+' »';
  return 'Gratuit';
}

ACT.item=function(t){
  var it=SBYID[t.dataset.id],p=me();if(!it||!p)return;
  fixP(p);
  var owned=p.owned.indexOf(it.id)>=0;
  if(usable(p,it)){
    if(!owned){p.owned.push(it.id);}
    p.equipped[it.kind]=(p.equipped[it.kind]===it.val)?'':it.val;
    S.smsg='';
  }else{
    var k=parseLock(it.lock);
    if(k.t==='coins'){
      if(p.coins<k.n){S.smsg='Il te manque '+(k.n-p.coins)+' 🪙 pour « '+it.name+' ». Joue encore un peu !';render();return;}
      p.coins-=k.n;p.owned.push(it.id);p.equipped[it.kind]=it.val;p.stats.buys++;
      S.smsg='Acheté : '+it.name+' !';sfx.win();
    }else{S.smsg=lockText(it).replace('🔒 ','Pour l’avoir : ')+'.';render();return;}
  }
  var aw=award(p);
  if(aw.list.length)S.smsg=(S.smsg?S.smsg+' · ':'')+'Nouveau trophée : '+aw.list.map(function(x){return x.name;}).join(', ')+' (+'+aw.coins+' 🪙)';
  p.t=Date.now();save();sfx.pop();render();
};
ACT.unequip=function(t){var p=me();if(!p)return;fixP(p);p.equipped[t.dataset.kind]='';p.t=Date.now();S.smsg='';save();sfx.pop();render();};

/* ================= jeux : démarrage ================= */
function mkQ(x,type){
  var w=WORLD[x.world],pic=(w.mode==='pic');
  if(pic&&!x.e){if(type==='A')type='C';else if(type==='B')type='D';}
  var needPic=pic&&type==='A';
  var pool=w.words.filter(function(y){return y!==x&&y.w!==x.w&&y.f!==x.f&&!(x.e&&y.e===x.e)&&(!needPic||y.e);});
  var opts=shuffle([x].concat(shuffle(pool).slice(0,3)));
  return{w:x,type:type,opts:opts,ci:opts.indexOf(x)};
}
function startQuiz(words,o){
  var list=shuffle(words).slice(0,o.n||8);
  S.q={qs:list.map(function(x){return mkQ(x,pickType());}),i:0,ok:0,ans:null,msg:null,o:o};
  S.backTo=o.back;
  go('quiz');
  playQ();
}
function playQ(){var q=S.q.qs[S.q.i];if(q.type==='A'||q.type==='C')speak(say(q.w));}

function startLearn(wid){
  S.ln={w:wid,i:0};S.backTo='world';
  ws(WORLD[wid].words[0]);save();
  go('learn');
  speak(say(WORLD[wid].words[0]));
}

function startMemory(wid){
  var w=WORLD[wid],d=DB.dir||'mix',pic=w.mode==='pic',pick6=shuffle(w.words).slice(0,6),cards=[];
  pick6.forEach(function(x){
    var fr=!pic||!x.e||d==='fr'||(d==='mix'&&Math.random()<0.5);
    cards.push({k:x.k,t:'p',fr:fr});cards.push({k:x.k,t:'w',fr:false});
  });
  S.mem={w:wid,cards:shuffle(cards).map(function(c){return{k:c.k,t:c.t,fr:c.fr,up:false,done:false};}),open:[],moves:0,pairs:0,lock:false,total:pick6.length};
  S.backTo='world';
  go('memory');
}

function setupLetter(){
  var L=S.lt,x=L.list[L.i],n=x.w.length,d=DB.dir||'mix';
  var cs=x.w.split('').map(function(c){return{c:c,used:false};}),t=0;
  do{cs=shuffle(cs);t++;}while(t<6&&cs.map(function(z){return z.c;}).join('')===x.w);
  L.tiles=cs;L.fill=[];L.lock=[];
  for(var i=0;i<n;i++){L.fill.push(null);L.lock.push(false);}
  L.mist=0;L.hint=0;L.done=false;L.bad=false;L.wrong=[];L.msg=null;
  L.mode='read';
}
function startLetters(wid){
  var w=WORLD[wid],el=w.words.filter(function(x){return /^[A-Za-zÄÖÜäöüß]{3,12}$/.test(x.w);});
  if(!el.length){S.msg='Aucun mot ne convient pour ce jeu : il faut 3 à 12 lettres, sans espace.';render();return;}
  S.lt={w:wid,list:shuffle(el).slice(0,6),i:0,ok:0};
  S.backTo='world';
  setupLetter();
  go('letters');
  if(S.lt.mode==='hear')speak(say(S.lt.list[0]));
}

function finish(o){
  var p=me(),lv0=level(p.xp),stars=o.acc>=0.9?3:o.acc>=0.6?2:1,t=todayN(),st,d=new Date(),first,gap,chest=false,coins;
  fixP(p);st=p.stats;
  first=p.last!==t;gap=p.last?t-p.last:0;
  p.stars+=stars;p.xp+=o.xp;bumpStreak();
  st.sessions++;st.correct+=o.ok||0;st.wrong+=Math.max(0,(o.n||0)-(o.ok||0));
  if(o.acc>=1)st.perfect++;
  if(first){st.days++;if(gap>7)st.comeback++;}
  st.bestStreak=Math.max(st.bestStreak,p.streak);
  if(d.getHours()<8)st.early++;
  if(d.getDay()===0||d.getDay()===6)st.weekend++;
  if(p.daily.date!==t)p.daily={date:t,count:0,chest:false};
  p.daily.count+=o.ok||0;
  if(!p.daily.chest&&p.daily.count>=DAILY_GOAL){p.daily.chest=true;chest=true;st.chests++;}
  coins=stars*3+(chest?CHEST_COINS:0);p.coins+=coins;
  var aw=award(p);
  p.t=Date.now();save();
  S.res={stars:stars,xp:o.xp,sub:o.sub,again:o.again,lvup:level(p.xp)>lv0,coins:coins+aw.coins,chest:chest,trophies:aw.list};
  go('result');
  sfx.win();confetti();
  speak(stars===3?'Fantastisch!':stars===2?'Sehr gut!':'Gut gemacht!');
}

/* memory */
ACT.flip=function(t){
  var M=S.mem,i=+t.dataset.i,c=M.cards[i];
  if(M.lock||c.up||c.done)return;
  c.up=true;t.classList.add('up');sfx.pop();
  var x=WBYK[c.k];
  if(c.t==='w')speak(say(x));
  M.open.push(i);
  if(M.open.length<2)return;
  M.moves++;
  var mv=document.getElementById('mmoves');if(mv)mv.textContent=M.moves;
  var ia=M.open[0],ib=M.open[1],a=M.cards[ia],b=M.cards[ib];
  function el(n){return app.querySelector('.mc[data-i="'+n+'"]');}
  if(a.k===b.k){
    a.done=true;b.done=true;
    M.open=[];M.pairs++;
    setTimeout(function(){if(el(ia))el(ia).classList.add('done');if(el(ib))el(ib).classList.add('done');sfx.ok();},350);
    ws(x);save();
    if(M.pairs===M.total){
      setTimeout(function(){
        if(S.screen!=='memory'||S.mem!==M)return;
        var acc=M.moves<=M.total+2?1:M.moves<=M.total+6?0.7:0.4;
        var wid=M.w;
        finish({ok:M.total,n:M.total,acc:acc,xp:30,sub:'Toutes les paires trouvées en '+M.moves+' coups',again:function(){startMemory(wid);}});
      },1100);
    }
  }else{
    M.lock=true;
    setTimeout(function(){
      if(S.screen!=='memory'||S.mem!==M)return;
      a.up=false;b.up=false;
      if(el(ia))el(ia).classList.remove('up');
      if(el(ib))el(ib).classList.remove('up');
      M.open=[];M.lock=false;
    },1000);
  }
};

/* lettres : les erreurs sont montrées (rouge ✗), les lettres justes restent (vert) */
function checkL(){
  var L=S.lt,x=L.list[L.i],i,wrong=[];
  for(i=0;i<L.fill.length;i++){if(L.fill[i]===null)return;}
  for(i=0;i<L.fill.length;i++){if(L.tiles[L.fill[i]].c!==x.w.charAt(i))wrong.push(i);}
  if(!wrong.length){
    L.done=true;L.msg=pick(PRAISE);
    var clean=(L.mist===0&&L.hint===0);
    grade(x,clean);if(clean)L.ok++;
    sfx.ok();speak(say(x));
    return;
  }
  L.mist++;L.bad=true;L.wrong=wrong;
  for(i=0;i<L.fill.length;i++){if(wrong.indexOf(i)<0)L.lock[i]=true;}
  sfx.bad();
  setTimeout(function(){
    if(S.screen!=='letters'||S.lt!==L||L.list[L.i]!==x)return;
    wrong.forEach(function(p){var id=L.fill[p];if(id!==null){L.tiles[id].used=false;L.fill[p]=null;}});
    L.bad=false;L.wrong=[];render();
  },1700);
}
ACT.tile=function(t){
  var L=S.lt;if(L.done||L.bad)return;
  var i=+t.dataset.i,tl=L.tiles[i];if(tl.used)return;
  var pos=L.fill.indexOf(null);if(pos<0)return;
  tl.used=true;L.fill[pos]=i;sfx.pop();
  checkL();render();
};
ACT.slot=function(t){
  var L=S.lt;if(L.done||L.bad)return;
  var i=+t.dataset.i;
  if(L.lock[i]||L.fill[i]===null)return;
  L.tiles[L.fill[i]].used=false;L.fill[i]=null;render();
};
ACT.clear=function(){
  var L=S.lt;if(L.done||L.bad)return;
  for(var i=0;i<L.fill.length;i++){if(!L.lock[i]&&L.fill[i]!==null){L.tiles[L.fill[i]].used=false;L.fill[i]=null;}}
  render();
};
ACT.hint=function(){
  var L=S.lt,x=L.list[L.i],pos=-1,ti=-1,i,j;
  if(L.done||L.bad)return;
  for(i=0;i<L.fill.length;i++){if(L.fill[i]===null){pos=i;break;}}
  if(pos<0)return;
  var need=x.w.charAt(pos);
  for(j=0;j<L.tiles.length;j++){if(!L.tiles[j].used&&L.tiles[j].c===need){ti=j;break;}}
  if(ti<0){
    for(i=0;i<L.fill.length;i++){
      var f=L.fill[i];
      if(f!==null&&!L.lock[i]&&L.tiles[f].c===need&&x.w.charAt(i)!==need){ti=f;L.fill[i]=null;L.tiles[f].used=false;break;}
    }
  }
  if(ti<0)return;
  L.tiles[ti].used=true;L.fill[pos]=ti;L.lock[pos]=true;L.hint++;sfx.pop();
  checkL();render();
};
ACT.lnextw=function(){
  var L=S.lt;if(!L.done)return;
  L.i++;
  if(L.i>=L.list.length){
    var wid=L.w,n=L.list.length;
    finish({ok:L.ok,n:n,acc:L.ok/n,xp:L.ok*10+(n-L.ok)*4+5,sub:L.ok+' / '+n+' mots trouvés sans aide ni erreur',again:function(){startLetters(wid);}});

};

/* sauvegarde : copie de secours des joueurs, progrès et mots, à garder ou à transférer vers un autre appareil */
function backupText(){
  var o={app:'deutsch-igi',v:1,players:DB.players,custom:DB.custom||[],hidden:DB.hidden||{},dir:DB.dir,rate:DB.rate,voice:DB.voice,sound:DB.sound};
  return JSON.stringify(o);
}
function mergePlayer(q){
  if(!q||!q.id||!q.name)return false;
  var p=null,ch=false;
  DB.players.forEach(function(x){if(x.id===q.id)p=x;});
  if(!p){
    var np={id:q.id,name:String(q.name).slice(0,14),color:q.color||COLORS[0],stars:q.stars||0,xp:q.xp||0,streak:q.streak||0,last:q.last||0,words:q.words||{},
      coins:q.coins,badges:q.badges,owned:q.owned,equipped:q.equipped,stats:q.stats,daily:q.daily,t:q.t};
    DB.players.push(fixP(np));
    return true;
  }
  var st=Math.max(p.stars||0,q.stars||0),xp=Math.max(p.xp||0,q.xp||0);
  if(st!==p.stars||xp!==p.xp){p.stars=st;p.xp=xp;ch=true;}
  if((q.last||0)>(p.last||0)||((q.last||0)===(p.last||0)&&(q.streak||0)>(p.streak||0))){p.last=q.last||0;p.streak=q.streak||0;ch=true;}
  p.words=p.words||{};
  Object.keys(q.words||{}).forEach(function(k){var a=p.words[k],b=q.words[k];if(b&&(!a||b.b>a.b||(b.b===a.b&&b.d>a.d))){p.words[k]=b;ch=true;}});
  fixP(p);
  var qb=q.badges||{},qs=q.stats||{},qe=q.equipped||{},qd=q.daily||{};
  Object.keys(qb).forEach(function(k){if(!p.badges[k]||qb[k]<p.badges[k]){p.badges[k]=qb[k];ch=true;}});
  (Array.isArray(q.owned)?q.owned:[]).forEach(function(k){if(p.owned.indexOf(k)<0){p.owned.push(k);ch=true;}});
  Object.keys(qs).forEach(function(k){if(typeof qs[k]==='number'&&qs[k]>(p.stats[k]||0)){p.stats[k]=qs[k];ch=true;}});
  if((q.t||0)>(p.t||0)){
    if(typeof q.coins==='number'&&q.coins!==p.coins){p.coins=q.coins;ch=true;}
    KINDS.forEach(function(k){if(typeof qe[k]==='string'&&qe[k]!==p.equipped[k]){p.equipped[k]=qe[k];ch=true;}});
    p.t=q.t;
  }
  if((qd.date||0)>p.daily.date||((qd.date||0)===p.daily.date&&(qd.count||0)>p.daily.count)){p.daily={date:qd.date||0,count:qd.count||0,chest:!!qd.chest};ch=true;}
  else if(qd.date===p.daily.date&&qd.chest&&!p.daily.chest){p.daily.chest=true;ch=true;}
  return ch;
}
function importBackup(txt){
  var o;
  try{o=JSON.parse(txt);}catch(e){return 'Texte illisible : copie la sauvegarde en entier.';}
  if(!o||o.app!=='deutsch-igi'||!Array.isArray(o.players))return 'Ce texte n’est pas une sauvegarde de l’appli.';
  o.players.forEach(function(q){mergePlayer(q);});
  DB.custom=DB.custom||[];
  var ids={};DB.custom.forEach(function(c){ids[c.id]=1;});
  (o.custom||[]).forEach(function(c){if(c&&c.id&&c.w&&c.f&&!ids[c.id]){DB.custom.push(c);ids[c.id]=1;}});
  DB.hidden=DB.hidden||{};
  Object.keys(o.hidden||{}).forEach(function(k){DB.hidden[k]=o.hidden[k];});
  if(!me()&&DB.players.length===1)DB.cur=DB.players[0].id;
  touchReg();migrateCustom();save();rebuildCustom();
  return 'Sauvegarde restaurée ('+o.players.length+' joueur'+(o.players.length>1?'s':'')+').';
}

window.IGI_APP={
  DB:function(){return DB;},
  fam:function(){return DB.fam||null;},
  setFam:function(c){DB.fam=c;lsSet(JSON.stringify(DB));},
  setCloud:function(p){for(var k in p)CL[k]=p[k];softRender();},
  setFsWords:setFsWords,
  payload:function(p){return {name:p.name,color:p.color,stars:p.stars||0,xp:p.xp||0,streak:p.streak||0,last:p.last||0,words:p.words||{},coins:p.coins||0,badges:p.badges||{},owned:p.owned||[],equipped:p.equipped||{},stats:p.stats||{},daily:p.daily||{date:0,count:0,chest:false},t:p.t||0};},
  mergePlayer:mergePlayer,
  afterMerge:function(){if(!me()&&DB.players.length===1)DB.cur=DB.players[0].id;lsSet(JSON.stringify(DB));rebuildCustom();softRender();},
  removePlayer:function(id){
    var had=DB.players.some(function(p){return p.id===id;});if(!had)return;
    DB.players=DB.players.filter(function(p){return p.id!==id;});
    if(DB.cur===id){DB.cur=DB.players.length===1?DB.players[0].id:null;}
    lsSet(JSON.stringify(DB));rebuildCustom();
    if(!me()&&S.screen!=='profiles')go('profiles');else softRender();
  },
  getReg:function(){return {hidden:DB.hidden||{},custom:DB.custom||[],upd:DB.rupd||0};},
  applyReg:function(r,union){
    r=r||{};
    if(union){
      DB.custom=DB.custom||[];DB.hidden=DB.hidden||{};
      var ids={};DB.custom.forEach(function(c){ids[c.id]=1;});
      (r.custom||[]).forEach(function(c){if(c&&c.id&&c.w&&c.f&&!ids[c.id]){DB.custom.push(c);ids[c.id]=1;}});
      Object.keys(r.hidden||{}).forEach(function(k){DB.hidden[k]=r.hidden[k];});
      touchReg();lsSet(JSON.stringify(DB));rebuildCustom();softRender();return 'push';
    }
    var loc=DB.rupd||0,up=r.upd||0;
    if(up>loc){DB.hidden=r.hidden||{};DB.custom=r.custom||[];DB.rupd=up;lsSet(JSON.stringify(DB));rebuildCustom();softRender();return 'adopted';}
    if(loc>up)return 'push';
    return 'same';
  }
};

    if(fm==='pin'){DB.pin=pv;S.parent=true;S.pmsg='Code créé. Mode parent actif.';save();}
    else if(pv===DB.pin){S.parent=true;S.pmsg=null;}
    else{S.pmsg='Code incorrect.';}
    render();return;
  }
  if(fm!=='addp')return;
  var inp=document.getElementById('pname'),name=(inp.value||'').trim();
  if(!name)return;
  var chosen=e.target.querySelector('input[name="pc"]:checked');
  var p={id:'p'+Date.now(),name:name,color:chosen?chosen.value:COLORS[0],stars:0,xp:0,streak:0,last:0,words:{}};
  fixP(p);DB.players.push(p);DB.cur=p.id;save();rebuildCustom();ctx();
  go('home');
  speak('Hallo, '+name+'!');
});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='rateRng'){DB.rate=+t.value;var v=document.getElementById('rateVal');if(v)v.textContent=DB.rate.toFixed(2);}
});
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='voiceSel'){DB.voice=t.value;save();speak('Guten Tag! Wir lernen Deutsch.');}
  if(t.id==='rateRng'){DB.rate=+t.value;save();speak('Das ist meine Stimme.');}
});
document.addEventListener('keydown',function(e){
  if(S.screen!=='learn')return;
  if(e.key==='ArrowRight')ACT.lnext();
  else if(e.key==='ArrowLeft')ACT.lprev();
});

/* ================= démarrage ================= */
loadVoices();
try{
  if(TTS.ok)speechSynthesis.onvoiceschanged=function(){loadVoices();if(S.screen==='settings'||S.screen==='home')render();};
}catch(e){}
setTimeout(function(){TTS.ready=true;loadVoices();if(S.screen==='home')render();},1800);
if(DB.players.length===1)DB.cur=DB.players[0].id;
if(!me())DB.cur=null;
migrateCustom();
rebuildCustom();
loadShared();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
S.screen=(me()&&DB.players.length===1)?'home':'profiles';
render();
})();
</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {getAuth,onAuthStateChanged,signInAnonymously,GoogleAuthProvider,signInWithPopup,signOut} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,getDocs,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
(function(){
  var A=window.IGI_APP;if(!A)return;
  var cfg={apiKey:"AIzaSyBPUsi4TXP9ieWraTsCULK8JGKln7I_Np0",authDomain:"deutsch-igi.firebaseapp.com",projectId:"deutsch-igi",storageBucket:"deutsch-igi.firebasestorage.app",messagingSenderId:"1040717364256",appId:"1:1040717364256:web:d424d91419d4c2ef421045"};
  var app,auth,db;
  try{
    app=initializeApp(cfg);auth=getAuth(app);
    db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
  }catch(e){A.setCloud({ready:false,off:true});return;}
  var unsubW=null,unsubP=null,unsubR=null,pendingUnion=false,lastPushed={},regLast='',timer=null;
  function famCol(code){return collection(db,'familles',code,'joueurs');}
  function regDoc(code){return doc(db,'familles',code,'reglages','main');}
  function pushPlayers(){
    var code=A.fam();if(!code||!auth.currentUser)return;
    A.DB().players.forEach(function(p){
      var pl=A.payload(p),s=JSON.stringify(pl);
      if(lastPushed[p.id]===s)return;
      setDoc(doc(db,'familles',code,'joueurs',p.id),pl).then(function(){lastPushed[p.id]=s;}).catch(function(){});
    });
  }
  function pushReg(force){
    var code=A.fam();if(!code||!auth.currentUser)return;
    var r=A.getReg(),s=JSON.stringify(r);
    if(!force&&s===regLast)return;
    setDoc(regDoc(code),r).then(function(){regLast=s;}).catch(function(){});
  }
  function startWords(){
    if(unsubW){unsubW();unsubW=null;}
    unsubW=onSnapshot(collection(db,'mots'),function(snap){
      var l=[];snap.forEach(function(d){var o=d.data();o.fid=d.id;l.push(o);});
      A.setFsWords(l);
    },function(){});
  }
  function stopFamily(){
    if(unsubP){unsubP();unsubP=null;}
    if(unsubR){unsubR();unsubR=null;}
  }
  function startFamily(){
    stopFamily();
    var code=A.fam();if(!code)return;
    unsubP=onSnapshot(famCol(code),function(snap){
      snap.docChanges().forEach(function(ch){
        var id=ch.doc.id;
        if(ch.type==='removed'){A.removePlayer(id);return;}
        var d=ch.doc.data();
        lastPushed[id]=JSON.stringify(A.payload(d));
        var o=Object.assign({id:id},d);
        A.mergePlayer(o);
      });
      A.afterMerge();
      pushPlayers();
      A.setCloud({status:'Synchronisé'});
    },function(){A.setCloud({status:'Hors ligne'});});
    unsubR=onSnapshot(regDoc(code),function(s){
      var res;
      if(s.exists()){res=A.applyReg(s.data(),pendingUnion);}
      else res=(pendingUnion||A.getReg().upd)?'push':'same';
      pendingUnion=false;
      if(res==='push')pushReg(true);
      else regLast=JSON.stringify(A.getReg());
    },function(){});
  }
  onAuthStateChanged(auth,function(u){
    if(!u){signInAnonymously(auth).catch(function(){A.setCloud({ready:false,off:true});});return;}
    A.setCloud({ready:true,off:false,user:{email:u.email||'',verified:!!u.emailVerified,anon:!!u.isAnonymous}});
    startWords();startFamily();
  });
  window.IGI_CLOUD={
    changed:function(){
      if(!A.fam()||!auth.currentUser)return;
      clearTimeout(timer);
      timer=setTimeout(function(){pushPlayers();pushReg(false);},2500);
    },
    joinFamily:async function(code,create){
      try{
        if(!auth.currentUser)return {ok:false,err:'Service non connecté : réessaie dans un instant.'};
        if(!create){
          var snap=await getDocs(famCol(code));
          if(snap.empty)return {ok:false,err:'Code inconnu : vérifie-le, ou crée un nouveau code sur le premier appareil.'};
        }
        A.setFam(code);lastPushed={};regLast='';pendingUnion=true;
        startFamily();pushPlayers();
        return {ok:true};
      }catch(e){return {ok:false,err:'Impossible de se connecter pour le moment.'};}
    },
    leaveFamily:function(){stopFamily();A.setFam(null);lastPushed={};regLast='';A.setCloud({status:''});},
    delPlayer:function(id){var code=A.fam();if(code&&auth.currentUser)deleteDoc(doc(db,'familles',code,'joueurs',id)).catch(function(){});delete lastPushed[id];},
    google:function(){
      signInWithPopup(auth,new GoogleAuthProvider()).catch(function(e){A.setCloud({err:'Connexion Google impossible ('+(e&&e.code?e.code:'erreur')+').'});});
    },
    signOut:function(){signOut(auth).catch(function(){});},
    addWord:function(o){
      var u=auth.currentUser;
      return setDoc(doc(collection(db,'mots')),{wid:o.wid,a:o.a||'',w:o.w,f:o.f,e:o.e||'',p:o.p||'',by:(u&&u.email)||'',t:Date.now()});
    },
    delWord:function(fid){return deleteDoc(doc(db,'mots',fid));}
  };
})();
</script>
